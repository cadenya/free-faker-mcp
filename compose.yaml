services:
  faker:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "50051"

  gateway:
    image: ghcr.io/cadenya/mcp-grpc-gateway:latest
    depends_on:
      - faker
    command:
      - --addr
      - 0.0.0.0:8080
      - --grpc-host
      - faker:50051
      - --service
      - faker.v1.FakerService
      - --require-tool-annotations
      - --path
      - /faker-mcp
    ports:
      - "8080:8080"
